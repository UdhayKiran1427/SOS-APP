name: dailykit_app
description: "DailyKit SOS Android Application"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State Management & Architecture
  provider: ^6.1.2

  # Networking & Storage
  dio: ^5.7.0
  flutter_secure_storage: ^9.2.2
  sqflite: ^2.4.1
  path: ^1.9.0

  # Sensors & Hardware
  geolocator: ^13.0.2
  permission_handler: ^11.3.1
  vibration: ^3.2.1
  url_launcher: ^6.3.1
  flutter_contacts: ^1.1.9+2
  home_widget: ^0.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
